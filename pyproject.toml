[project]
name = "cast-trim-upload"
version = "0.1.0"
description = "Download a YouTube/Twitch section as audio, trim it and upload it to Spotify for Creators"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "yt-dlp[default]>=2025.11.12",
    "playwright>=1.48",
    "mutagen>=1.47",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
cast-trim-upload = "cast_trim_upload.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/cast_trim_upload"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: downloads real media from YouTube/Twitch (deselect with -m 'not network')",
]
